name: Godot Builds

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    name: Export Android + Web
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install CI runtime dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig curl jq
          rm -rf /var/lib/apt/lists/*

      - name: Prepare Godot export environment
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -R "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/godot
          cp /root/.config/godot/editor_settings-4.7.tres ~/.config/godot/editor_settings-4.7.tres
          ls -lah ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cat ~/.config/godot/editor_settings-4.7.tres

      - name: Ensure Android SDK 35 tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Sync pinned REALM ALLIANCE production assets
        shell: bash
        run: bash scripts/sync_realm_assets.sh

      - name: Upload runtime art diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: realm-alliance-runtime-art
          path: |
            assets/realm_alliance/runtime/hero/*.png
            assets/realm_alliance/production/hero/realmwaechter/*.png
            assets/realm_alliance/production/weapons/realmblade/*.png
            assets/realm_alliance/v2_game/monsters/greenvale/states/*.png
          if-no-files-found: error

      - name: Import project
        shell: bash
        run: godot --headless --verbose --path . --import

      - name: Validate project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . --editor --quit 2>&1 | tee /tmp/godot-validate.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:|Invalid call|Invalid access|Attempt to call" /tmp/godot-validate.log; then
            echo "Fatal Godot script error detected during validation."
            exit 1
          fi

      - name: Smoke test main scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . --quit-after 10 2>&1 | tee /tmp/godot-smoke.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:|Invalid call|Invalid access|Attempt to call" /tmp/godot-smoke.log; then
            echo "Fatal Godot script error detected during runtime smoke test."
            exit 1
          fi

      - name: Export Web
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html

      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android Debug" build/android/RealmAllianceV2.apk

      - name: Package Web bundle
        shell: bash
        run: |
          rm -f build/test-game-factory-web.zip
          (
            cd build/web
            zip -q -r ../test-game-factory-web.zip .
          )

      - name: Publish commit-bound Web bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          API="https://api.github.com"
          REPO="${GITHUB_REPOSITORY}"
          ASSET="test-game-factory-web.zip"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"

          if [ "${BUILD_EVENT}" = "pull_request" ]; then
            TAG="web-preview-${BUNDLE_SHA}"
            RELEASE_NAME="Preview Web Build ${BUNDLE_SHA:0:8}"
          else
            TAG="web-live"
            RELEASE_NAME="Live Web Build"
          fi

          echo "Publishing ${TAG} for ${BUNDLE_SHA}"

          release_json="$(curl -fsSL -H "$AUTH" -H "$ACCEPT" "$API/repos/$REPO/releases/tags/$TAG" || true)"

          if [ -z "$release_json" ]; then
            payload="$(jq -n \
              --arg tag "$TAG" \
              --arg sha "$BUNDLE_SHA" \
              --arg name "$RELEASE_NAME" \
              '{tag_name:$tag,target_commitish:$sha,name:$name,body:"commit=pending",prerelease:true}')"
            release_json="$(curl -fsSL -X POST -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json" \
              "$API/repos/$REPO/releases" -d "$payload")"
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"

          existing_asset_id="$(printf '%s' "$release_json" | jq -r --arg name "$ASSET" \
            '.assets[]? | select(.name == $name) | .id' | head -n1)"

          if [ -n "$existing_asset_id" ] && [ "$existing_asset_id" != "null" ]; then
            curl -fsSL -X DELETE -H "$AUTH" -H "$ACCEPT" \
              "$API/repos/$REPO/releases/assets/$existing_asset_id"
          fi

          curl -fsSL -X POST -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/zip" \
            --data-binary "@build/$ASSET" \
            "https://uploads.github.com/repos/$REPO/releases/$release_id/assets?name=$ASSET" >/dev/null

          ready_payload="$(jq -n --arg body "commit=$BUNDLE_SHA" '{body:$body}')"
          curl -fsSL -X PATCH -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json" \
            "$API/repos/$REPO/releases/$release_id" -d "$ready_payload" >/dev/null

          echo "Published Web bundle for $BUNDLE_SHA"

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: test-game-factory-web
          path: build/web
          if-no-files-found: error

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: realm-alliance-v2-android
          path: build/android/RealmAllianceV2.apk
          if-no-files-found: error
