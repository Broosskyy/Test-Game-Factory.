name: Godot Builds

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    name: Export Android + Web
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CI runtime dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig curl jq
          rm -rf /var/lib/apt/lists/*

      - name: Prepare Godot export environment
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -R "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/godot
          cp /root/.config/godot/editor_settings-4.7.tres ~/.config/godot/editor_settings-4.7.tres
          ls -lah ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cat ~/.config/godot/editor_settings-4.7.tres

      - name: Ensure Android SDK 35 tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Sync pinned REALM ALLIANCE production assets
        shell: bash
        run: bash scripts/sync_realm_assets.sh

      - name: Import project
        shell: bash
        run: godot --headless --verbose --path . --import

      - name: Validate project
        shell: bash
        run: godot --headless --verbose --path . --editor --quit

      - name: Smoke test main scene
        shell: bash
        run: godot --headless --verbose --path . --quit-after 10

      - name: Export Web
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html

      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android Debug" build/android/RealmAllianceV2.apk

      - name: Package live Web bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          rm -f build/test-game-factory-web.zip
          (
            cd build/web
            zip -q -r ../test-game-factory-web.zip .
          )

      - name: Publish live Web bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          API="https://api.github.com"
          REPO="${GITHUB_REPOSITORY}"
          TAG="web-live"
          ASSET="test-game-factory-web.zip"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"

          release_json="$(curl -fsSL -H "$AUTH" -H "$ACCEPT" "$API/repos/$REPO/releases/tags/$TAG" || true)"

          if [ -z "$release_json" ]; then
            payload="$(jq -n               --arg tag "$TAG"               --arg sha "$GITHUB_SHA"               '{tag_name:$tag,target_commitish:$sha,name:"Live Web Build",body:"commit=pending",prerelease:true}')"
            release_json="$(curl -fsSL -X POST -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json"               "$API/repos/$REPO/releases" -d "$payload")"
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"

          existing_asset_id="$(printf '%s' "$release_json" | jq -r --arg name "$ASSET"             '.assets[]? | select(.name == $name) | .id' | head -n1)"

          if [ -n "$existing_asset_id" ] && [ "$existing_asset_id" != "null" ]; then
            curl -fsSL -X DELETE -H "$AUTH" -H "$ACCEPT"               "$API/repos/$REPO/releases/assets/$existing_asset_id"
          fi

          curl -fsSL -X POST -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/zip"             --data-binary "@build/$ASSET"             "https://uploads.github.com/repos/$REPO/releases/$release_id/assets?name=$ASSET" >/dev/null

          ready_payload="$(jq -n --arg body "commit=$GITHUB_SHA" '{body:$body}')"
          curl -fsSL -X PATCH -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json"             "$API/repos/$REPO/releases/$release_id" -d "$ready_payload" >/dev/null

          echo "Published live Web bundle for $GITHUB_SHA"

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: test-game-factory-web
          path: build/web
          if-no-files-found: error

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: realm-alliance-v2-android
          path: build/android/TestGameFactory.apk
          if-no-files-found: error
